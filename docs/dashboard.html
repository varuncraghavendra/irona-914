<!doctype html>
<meta charset="utf-8">
<title>Irona 914 — run inspector</title>
<style>
  :root { color-scheme: dark; --bg:#12141a; --panel:#1b1f27; --line:#2b313d; --ink:#e7ebf2; --dim:#96a0b2;
          --ok:#63d2a4; --warn:#e6b455; --bad:#e2686f; --key:#7fb2ff; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:13px/1.5 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  header { padding:14px 20px; border-bottom:1px solid var(--line); display:flex; gap:24px; align-items:baseline; flex-wrap:wrap; }
  h1 { font-size:15px; margin:0; font-weight:600; letter-spacing:.2px; }
  header .meta { color:var(--dim); font-size:12px; }
  main { display:grid; grid-template-columns: minmax(0,1.35fr) minmax(320px,.65fr); gap:18px; padding:18px 20px 28px; align-items:start; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:14px; }
  .panel h2 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin:0 0 10px; font-weight:600; }
  .views { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .views figure { margin:0; }
  .views img { width:100%; image-rendering:pixelated; border-radius:5px; background:#000; display:block; }
  .views figcaption { color:var(--dim); font-size:11px; margin-top:5px; }
  .controls { display:flex; gap:12px; align-items:center; margin-top:14px; }
  input[type=range] { flex:1; accent-color:var(--key); }
  button { background:#262c37; color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:5px 11px; cursor:pointer; font:inherit; }
  button:hover { border-color:var(--key); }
  table { width:100%; border-collapse:collapse; }
  td { padding:3px 0; vertical-align:top; }
  td.k { color:var(--dim); width:44%; white-space:nowrap; padding-right:10px; }
  td.v { font-variant-numeric:tabular-nums; }
  .state { display:inline-block; padding:1px 8px; border-radius:999px; background:#2a3240; color:var(--key); font-size:11px; }
  .track { position:relative; height:26px; margin-top:12px; border-radius:5px; overflow:hidden; background:#151922; border:1px solid var(--line); }
  .track span { position:absolute; top:0; bottom:0; opacity:.85; }
  .legend { display:flex; gap:10px; flex-wrap:wrap; color:var(--dim); font-size:11px; margin-top:7px; }
  .legend i { display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:4px; vertical-align:-1px; }
  canvas { width:100%; height:120px; display:block; }
  .err { color:var(--bad); }
</style>
<header>
  <h1>Irona 914 — run inspector</h1>
  <div class="meta" id="meta">loading index.json…</div>
</header>
<main>
  <section class="panel">
    <h2>Camera frame <span id="frameId" class="state"></span></h2>
    <div class="views">
      <figure><img id="rgb" alt="annotated colour frame"><figcaption>Colour, with the segmented vase outlined and the blob centroid marked</figcaption></figure>
      <figure><img id="depth" alt="depth frame"><figcaption>Rendered depth, near red to far blue</figcaption></figure>
    </div>
    <div class="controls">
      <button id="prev">◀</button><button id="play">Play</button><button id="next">▶</button>
      <input type="range" id="slider" min="0" value="0">
      <span id="clock" class="state">0.00 s</span>
    </div>
    <div class="track" id="track"></div>
    <div class="legend" id="legend"></div>
  </section>
  <section class="panel">
    <h2>Annotations</h2>
    <table id="fields"></table>
    <h2 style="margin-top:18px">Estimate error vs the true vase</h2>
    <canvas id="chart" width="600" height="120"></canvas>
    <div class="legend"><span><i style="background:var(--key)"></i>horizontal error (mm)</span><span><i style="background:var(--ok)"></i>detected pixels</span></div>
  </section>
</main>
<script>
const STATE_COLOUR = {search:'#4d5a6e', approach:'#7fb2ff', settle:'#9d8bff', reach:'#e6b455',
                      enclose:'#f0954b', close:'#e2686f', lift:'#63d2a4', hold:'#3fae87',
                      done:'#2f8f6d', failed:'#8b3a40', groot:'#c77dff'};
let data = null, current = 0, timer = null;

const $ = id => document.getElementById(id);
const fmt = (v, n = 3) => Array.isArray(v) ? '[' + v.map(x => (+x).toFixed(n)).join(', ') + ']'
                        : (v === null || v === undefined) ? '—' : (typeof v === 'number' ? v.toFixed(n) : v);

function distance(a, b) {
  if (!a || !b) return null;
  return Math.hypot(a[0] - b[0], a[1] - b[1]) * 1000;
}

function show(i) {
  const f = data.frames[i]; if (!f) return;
  current = i;
  $('rgb').src = f.image;
  $('depth').src = f.depth || '';
  $('depth').style.visibility = f.depth ? 'visible' : 'hidden';
  $('slider').value = i;
  $('clock').textContent = f.t.toFixed(2) + ' s';
  $('frameId').textContent = '#' + f.frame + ' · ' + f.state;
  const d = f.detection || {};
  const rows = [
    ['mission state', f.state],
    ['detector', f.detector],
    ['policy', f.policy || 'scripted'],
    ['segmented pixels', d.pixels ?? '—'],
    ['range to blob (m)', fmt(d.range)],
    ['blob centroid (u,v)', d.uv ? fmt(d.uv, 1) : '—'],
    ['estimate (world)', fmt(f.estimate)],
    ['true vase (world)', fmt(f.vase_true)],
    ['horizontal error (mm)', fmt(distance(f.estimate, f.vase_true), 1)],
    ['grasp aim point', fmt(f.grasp_target)],
    ['measured palm', fmt(f.palm)],
    ['hand closure', fmt(f.closure, 2)],
    ['pelvis', fmt(f.pelvis)],
  ];
  if (f.groot) {
    rows.push(['GR00T latency (ms)', fmt(f.groot.latency_ms, 1)]);
    rows.push(['GR00T right_arm[0:3]', fmt(f.groot.right_arm, 3)]);
    rows.push(['GR00T hand', fmt(f.groot.hand, 3)]);
  }
  $('fields').innerHTML = rows.map(([k, v]) =>
    `<tr><td class="k">${k}</td><td class="v">${v}</td></tr>`).join('');
}

function buildTrack() {
  const track = $('track'), n = data.frames.length;
  track.innerHTML = '';
  const seen = new Set();
  data.frames.forEach((f, i) => {
    const s = document.createElement('span');
    s.style.left = (100 * i / n) + '%';
    s.style.width = (100 / n + 0.15) + '%';
    s.style.background = STATE_COLOUR[f.state] || '#4d5a6e';
    s.title = `${f.t.toFixed(2)} s — ${f.state}`;
    s.onclick = () => show(i);
    track.appendChild(s);
    seen.add(f.state);
  });
  $('legend').innerHTML = [...seen].map(s =>
    `<span><i style="background:${STATE_COLOUR[s] || '#4d5a6e'}"></i>${s}</span>`).join('');
}

function chart() {
  const c = $('chart'), ctx = c.getContext('2d');
  const w = c.width, h = c.height;
  ctx.clearRect(0, 0, w, h);
  const errors = data.frames.map(f => distance(f.estimate, f.vase_true));
  const pixels = data.frames.map(f => (f.detection || {}).pixels || 0);
  const maxError = Math.max(60, ...errors.filter(v => v !== null));
  const maxPixels = Math.max(1, ...pixels);
  const line = (values, scale, colour) => {
    ctx.strokeStyle = colour; ctx.lineWidth = 1.5; ctx.beginPath();
    let started = false;
    values.forEach((v, i) => {
      if (v === null) { started = false; return; }
      const x = w * i / Math.max(1, values.length - 1), y = h - 6 - (h - 14) * Math.min(1, v / scale);
      started ? ctx.lineTo(x, y) : ctx.moveTo(x, y); started = true;
    });
    ctx.stroke();
  };
  ctx.strokeStyle = '#2b313d'; ctx.strokeRect(.5, .5, w - 1, h - 1);
  line(pixels, maxPixels, '#63d2a4');
  line(errors, maxError, '#7fb2ff');
  ctx.fillStyle = '#96a0b2'; ctx.font = '10px sans-serif';
  ctx.fillText(`${maxError.toFixed(0)} mm / ${maxPixels} px full scale`, 6, 11);
}

fetch('index.json').then(r => r.json()).then(j => {
  data = j;
  const s = j.run.summary || {};
  $('meta').innerHTML = `${j.frames.length} frames · scene <b>${s.scene || '—'}</b> · `
    + `object ${s.object ? s.object.name + ' r=' + (s.object.radius_m * 1000).toFixed(0) + ' mm' : '—'} · `
    + `final state <b>${s.state || '—'}</b> · lift <b>${s.vase_lift_m ?? '—'} m</b>`
    + (s.grasp_policy ? ` · policy <b>${s.grasp_policy}</b>` : '');
  $('slider').max = j.frames.length - 1;
  buildTrack(); chart(); show(0);
}).catch(e => { $('meta').innerHTML = '<span class="err">could not load index.json: ' + e + '</span>'; });

$('slider').oninput = e => show(+e.target.value);
$('prev').onclick = () => show(Math.max(0, current - 1));
$('next').onclick = () => show(Math.min(data.frames.length - 1, current + 1));
$('play').onclick = e => {
  if (timer) { clearInterval(timer); timer = null; e.target.textContent = 'Play'; return; }
  e.target.textContent = 'Pause';
  timer = setInterval(() => {
    if (current >= data.frames.length - 1) { clearInterval(timer); timer = null; $('play').textContent = 'Play'; return; }
    show(current + 1);
  }, 250);
};
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') show(Math.max(0, current - 1));
  if (e.key === 'ArrowRight') show(Math.min(data.frames.length - 1, current + 1));
});
</script>
